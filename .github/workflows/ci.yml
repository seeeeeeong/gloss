name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # The same task the pre-push hook runs: compile, test (Testcontainers PostgreSQL),
      # ktlint, detekt, Konsist, ArchUnit and Spring Modulith.
      - run: ./gradlew check --console=plain

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from web/package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The same script the pre-push hook runs: Biome and the type check.
      - run: pnpm check

      # A page that only fails when it is rendered fails here, not after deploy.
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a pull request the action lists the PR's commits through the API to
      # scan only those; without this it fails with 403 before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit on the branch, not just its tip: a secret committed and
          # then deleted is still published.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
