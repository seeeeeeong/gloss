version: 2

updates:
  # Reads gradle/libs.versions.toml, which build-logic shares.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # "chore(deps): bump …", which the PR title check accepts.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # detekt analyses with the Kotlin it was built against. Kotlin moves when
      # detekt does, in one change.
      - dependency-name: 'org.jetbrains.kotlin*'
    groups:
      # Tests and linters move together; one PR a week rather than five.
      build-tooling:
        patterns: ['org.junit*', 'org.assertj*', 'dev.detekt*', 'com.diffplug.spotless*', 'com.lemonappdev*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # pnpm refuses versions younger than its minimum release age, and a fresh release
    # is the one most likely to be pulled. A week keeps Dependabot inside both.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The types follow the Node the web runs on (.nvmrc, deploy/web.Dockerfile),
      # not the newest Node: types ahead of the runtime allow calls it does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is the new native compiler. Moving to it is its own change, once
      # Next supports it, not a weekly bump.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Next and React are released to work together; one moving without the
      # other is how a hydration mismatch ships.
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      build-tooling:
        patterns: ['@biomejs/*', 'typescript', 'tailwindcss', '@tailwindcss/*', '@types/node']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
