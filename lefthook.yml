# Rulesets need GitHub Pro on a private repo, so main and dev are guarded here.
# `--no-verify` bypasses it. ./gradlew check stays the authority.
#
# Setup: brew install lefthook cocogitto ktlint && lefthook install

pre-commit:
  parallel: true
  jobs:
    - name: guard main and dev
      run: |
        case "$(git branch --show-current)" in
          main|dev)
            echo ''
            echo '✖ main and dev are protected. Start a branch from dev instead:'
            echo ''
            echo '    git fetch && git switch -c feat/<what-becomes-true> --no-track origin/dev'
            echo ''
            exit 1
            ;;
        esac
    - name: ktlint
      glob: '*.{kt,kts}'
      run: |
        ktlint --format {staged_files} || {
          echo ''
          echo '✖ ktlint found issues it could not fix automatically.'
          echo '  Run:  ./gradlew spotlessApply      then review, stage, and commit again.'
          echo ''
          exit 1
        }
      stage_fixed: true
    - name: biome
      # Paths are given relative to web/, where biome.json and the binary live.
      root: 'web/'
      glob: '*.{ts,tsx,js,mjs,json,jsonc,css}'
      run: |
        pnpm exec biome check --write --no-errors-on-unmatched {staged_files} || {
          echo ''
          echo '✖ Biome found issues it could not fix automatically.'
          echo '  Run:  pnpm --dir web fix      then review, stage, and commit again.'
          echo ''
          exit 1
        }
      stage_fixed: true

commit-msg:
  jobs:
    - name: cocogitto
      run: |
        cog verify --file {1} || {
          echo ''
          echo '✖ Commit message must follow Conventional Commits, with a scope from cog.toml.'
          echo '    feat(account): 계정 생성 API 추가'
          echo '    fix(chat): 잘린 응답이 완료로 표시되는 문제 수정'
          echo '  Work is rebase merged, so this message lands on dev as written.'
          echo ''
          exit 1
        }

pre-push:
  jobs:
    - name: guard main and dev
      run: |
        case "$(git branch --show-current)" in
          main|dev)
            echo ''
            echo '✖ Do not push main or dev directly. Open a pull request so CI runs first.'
            echo ''
            echo '    git switch -c feat/<what-becomes-true> --no-track origin/dev'
            echo '    gh pr create'
            echo ''
            exit 1
            ;;
        esac
    - name: server check
      run: |
        ./gradlew check --console=plain -q || {
          echo ''
          echo '✖ ./gradlew check failed. Formatting alone:  ./gradlew spotlessApply'
          echo ''
          exit 1
        }
    - name: web check
      run: |
        pnpm --dir web check || {
          echo ''
          echo '✖ pnpm --dir web check failed. Formatting alone:  pnpm --dir web fix'
          echo ''
          exit 1
        }
