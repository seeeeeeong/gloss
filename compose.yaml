# Local development only. A deployment has its own compose file; this one starts
# nothing but the database the server expects.
services:
  postgres:
    image: postgres:18-alpine
    profiles: [local]
    environment:
      POSTGRES_DB: gloss
      POSTGRES_USER: gloss
      POSTGRES_PASSWORD: gloss
    ports:
      # 55433: margin's local PostgreSQL already holds 55432 on this machine.
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloss -d gloss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
