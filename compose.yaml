services:
  postgres:
    image: postgres:18-alpine
    profiles: [local]
    environment:
      POSTGRES_DB: gloss
      POSTGRES_USER: gloss
      POSTGRES_PASSWORD: gloss
    ports:
      # 55432 is taken by another local project.
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloss -d gloss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
