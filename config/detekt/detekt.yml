complexity:
  # Same limit as Biome.
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 12
  LongParameterList:
    ignoreDefaultParameters: true
    # An entity's constructor is its table's columns.
    ignoreAnnotated: ['Entity']
  TooManyFunctions:
    ignoreOverridden: true

style:
  ReturnCount:
    excludeGuardClauses: true
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '400', '401', '403', '404', '409', '429', '500', '503']
    ignoreEnums: true
  ForbiddenComment:
    comments:
      - value: 'TODO'
        reason: 'Link an issue (https://github.com/seeeeeeong/gloss/issues/N) or do it now.'
      - value: 'FIXME'
        reason: 'Link an issue (https://github.com/seeeeeeong/gloss/issues/N) or fix it now.'
      - value: 'STOPSHIP'
        reason: 'Address this before merging.'
    allowedPatterns: 'github\.com/seeeeeeong/gloss/issues/\d+'
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.io.print'
        reason: 'Use a logger.'
      - value: 'kotlin.io.println'
        reason: 'Use a logger.'
      - value: 'java.lang.Thread.sleep'
        reason: 'Inject a Clock and advance it instead of waiting.'
