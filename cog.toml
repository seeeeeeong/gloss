  "plan",
  "post",
  "generation",
  "chat",
  # Everything else.
  "web",
  "server",
  "core",
  "arch",
  "ci",
  "deps",
  # Dependabot titles npm devDependency bumps chore(deps-dev).
  "deps-dev",
  "deploy",
  "repo",
]
