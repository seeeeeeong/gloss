gloss:
  api-key:
    # All zeros: tests seal only test keys, and a real master key never belongs in the repository.
    master-keys: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  budget:
    # Tests call expireStale themselves; a background round would expire what a moved clock left.
    expire-first-after: P365D
  generation:
    # Tests run the worker and the reaper themselves; in the background they would take other tests' jobs.
    autostart: false
    reap-first-after: P365D
  book-source:
    # Tests share one instance and run in the same second; the pace is BookSourceThrottleTest's to check.
    per-second: 1000
