server:
  shutdown: graceful
  # Loopback: only the reverse proxy should reach it.
  address: ${GLOSS_SERVER_HOST:127.0.0.1}
  port: ${GLOSS_SERVER_PORT:8140}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: gloss-server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${GLOSS_DB_URL:jdbc:postgresql://127.0.0.1:55433/gloss}
    username: ${GLOSS_DB_USER:gloss}
    password: ${GLOSS_DB_PASSWORD:gloss}
  flyway:
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
