server:
  shutdown: graceful
  # Loopback: only the reverse proxy should reach it.
  address: ${GLOSS_SERVER_HOST:127.0.0.1}
  port: ${GLOSS_SERVER_PORT:8140}
  # X-Forwarded-* decide the scheme, so the session cookie is Secure behind HTTPS. Safe only
  # because nothing but the proxy reaches the server, which replaces those headers.
  forward-headers-strategy: framework
  servlet:
    session:
      # A reader on a phone and a laptop signs in about monthly; a password change or suspension still ends it at once.
      timeout: 30d
      cookie:
        name: gloss_session
        max-age: 30d
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: gloss-server
  autoconfigure:
    # It would make a default user and log its generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.dotenv]
  datasource:
    url: ${GLOSS_DB_URL:jdbc:postgresql://127.0.0.1:55434/gloss}
    username: ${GLOSS_DB_USER:gloss}
    password: ${GLOSS_DB_PASSWORD:gloss}
  session:
    jdbc:
      initialize-schema: never
  modulith:
    # Modules live under gloss.domain, a level down; each declares itself in ModuleMetadata.
    detection-strategy: explicitly-annotated
    events:
      # A delivered event is deleted; a failed or unfinished one stays to be delivered again.
      completion-mode: delete
      # One instance runs, so an event a crash left undelivered is safe to resend at the next start.
      republish-outstanding-events-on-restart: true
  flyway:
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gloss:
  first-operator:
    login-id: ${GLOSS_FIRST_OPERATOR_LOGIN_ID:}
    password: ${GLOSS_FIRST_OPERATOR_PASSWORD:}
    display-name: ${GLOSS_FIRST_OPERATOR_NAME:}
