server:
  shutdown: graceful
  # Loopback: only the reverse proxy should reach it.
  address: ${GLOSS_SERVER_HOST:127.0.0.1}
  port: ${GLOSS_SERVER_PORT:8140}
  # X-Forwarded-* decide the scheme, so the session cookie is Secure behind HTTPS. Safe only
  # because nothing but the proxy reaches the server, which replaces those headers.
  forward-headers-strategy: framework
  servlet:
    session:
      # A reader on a phone and a laptop signs in about monthly; a password change or suspension still ends it at once.
      timeout: 30d
      cookie:
        name: gloss_session
        max-age: 30d
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: gloss-server
  autoconfigure:
    # It would make a default user and log its generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.dotenv]
  datasource:
    url: ${GLOSS_DB_URL:jdbc:postgresql://127.0.0.1:55434/gloss}
    username: ${GLOSS_DB_USER:gloss}
    password: ${GLOSS_DB_PASSWORD:gloss}
  session:
    jdbc:
      initialize-schema: never
  modulith:
    # Each module under gloss declares itself in ModuleMetadata; ModularityTest finds one that forgot.
    detection-strategy: explicitly-annotated
    events:
      # A delivered event is deleted; a failed or unfinished one stays to be delivered again.
      completion-mode: delete
      # One instance runs, so an event a crash left undelivered is safe to resend at the next start.
      republish-outstanding-events-on-restart: true
  flyway:
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gloss:
  budget:
    # Starting values for how often one reader's key may be called; each change is its own pull
    # request that states the cost. A tutor turn and a generation can run together, so four at
    # once leaves room without letting a loop run wide.
    in-flight: 4
    # A reader typing to the tutor stays far below these; a runaway loop or script does not.
    per-minute: 30
    per-hour: 300
    # Ends reservations a crash left open; the first round waits for the instance to settle in.
    expire-every: PT1M
    expire-first-after: PT1M
  api-key:
    # version:base64 pairs of 32-byte keys; the newest seals. Kept apart from every other secret.
    master-keys: ${GLOSS_API_KEY_MASTER_KEYS:}
  deepseek:
    base-url: ${GLOSS_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # The longest gap allowed between two pieces of a stream: long enough for a slow first token
    # after a large prompt, short enough that a stalled connection does not hold a reservation.
    idle-timeout: PT2M
    # The longest a whole call may run; under budget's 30-minute expiry, so a live call is never
    # expired as a crash's leftover and its settle always lands.
    call-deadline: PT20M
  first-operator:
    login-id: ${GLOSS_FIRST_OPERATOR_LOGIN_ID:}
    password: ${GLOSS_FIRST_OPERATOR_PASSWORD:}
    display-name: ${GLOSS_FIRST_OPERATOR_NAME:}
