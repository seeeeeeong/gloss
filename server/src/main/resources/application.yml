server:
  shutdown: graceful
  # Loopback: only the reverse proxy should reach it.
  address: ${GLOSS_SERVER_HOST:127.0.0.1}
  port: ${GLOSS_SERVER_PORT:8140}
  # X-Forwarded-* decide the scheme, so the session cookie is Secure behind HTTPS. Safe only
  # because nothing but the proxy reaches the server, which replaces those headers.
  forward-headers-strategy: framework
  servlet:
    session:
      # A reader on a phone and a laptop signs in about monthly; a password change or suspension still ends it at once.
      timeout: 30d
      cookie:
        name: gloss_session
        max-age: 30d
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: gloss-server
  autoconfigure:
    # It would make a default user and log its generated password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.dotenv]
  datasource:
    url: ${GLOSS_DB_URL:jdbc:postgresql://127.0.0.1:55434/gloss}
    username: ${GLOSS_DB_USER:gloss}
    password: ${GLOSS_DB_PASSWORD:gloss}
  session:
    jdbc:
      initialize-schema: never
  modulith:
    # Each module under gloss declares itself in ModuleMetadata; ModularityTest finds one that forgot.
    detection-strategy: explicitly-annotated
    events:
      # A delivered event is deleted; a failed or unfinished one stays to be delivered again.
      completion-mode: delete
      # One instance runs, so an event a crash left undelivered is safe to resend at the next start.
      republish-outstanding-events-on-restart: true
  flyway:
    validate-on-migrate: true
  lifecycle:
    # A stopping instance lets a running job finish its model call: past the call's deadline, a read
    # under way may take one idle timeout more (20 + 2 minutes). A job cut short would be run, and
    # billed, again.
    timeout-per-shutdown-phase: PT25M
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

gloss:
  budget:
    # Starting values for how often one reader's key may be called; each change is its own pull
    # request that states the cost. A tutor turn and a generation can run together, so four at
    # once leaves room without letting a loop run wide.
    in-flight: 4
    # A reader typing to the tutor stays far below these; a runaway loop or script does not.
    per-minute: 30
    per-hour: 300
    # Ends reservations a crash left open; the first round waits for the instance to settle in.
    expire-every: PT1M
    expire-first-after: PT1M
  api-key:
    # version:base64 pairs of 32-byte keys; the newest seals. Kept apart from every other secret.
    master-keys: ${GLOSS_API_KEY_MASTER_KEYS:}
  deepseek:
    base-url: ${GLOSS_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # The longest gap allowed between two pieces of a stream: long enough for a slow first token
    # after a large prompt, short enough that a stalled connection does not hold a reservation.
    idle-timeout: PT2M
    # The longest a whole call may run; under budget's 30-minute expiry, so a live call is never
    # expired as a crash's leftover and its settle always lands.
    call-deadline: PT20M
  yes24:
    base-url: ${GLOSS_YES24_BASE_URL:https://apis.yes24.com/v1}
    # The operator's key for YES24's Open API; without one, books are typed in.
    api-key: ${GLOSS_YES24_API_KEY:}
  exa:
    base-url: ${GLOSS_EXA_BASE_URL:https://api.exa.ai}
    # The operator's key for Exa's search; without one, the model is not offered a web search.
    api-key: ${GLOSS_EXA_API_KEY:}
  setup:
    # Web searches run on the operator's key at about $0.007 each (Exa's auto search, five results).
    # In any 24 hours one reader may ask this many, and every reader together this many: at most
    # about $0.70 a day. Each change is its own pull request that states the cost.
    web-searches-per-reader: 20
    web-searches-per-day: 100
    # Model turns one instance runs at once, across readers; one more is answered "busy" at once.
    turns-at-once: 4
    async-turns: true
  book-source:
    # YES24's basic tier allows the key 10 calls a second and 20,000 a day, for every reader together.
    # Under both, so a second that falls across two of theirs, or a restart that forgets the day's
    # count, still fits.
    per-second: 8
    per-day: 18000
    # Searches and adds one reader may make a minute: far more than choosing an edition takes, and a
    # reader's loop stops here without holding back the others.
    per-minute: 20
  generation:
    # Jobs one instance runs at once, across readers: a handful of invited readers wait little, and a
    # backlog never runs wide on the home server. Each reader's key is still held to budget's caps.
    concurrency: 2
    # The lease is four beats: a worker that is alive keeps its job through three missed ones, while
    # a dead one's job waits a minute, not the length of a model call, before running again.
    heartbeat-every: PT15S
    autostart: true
    # How long past its lease a dead worker's job may sit: half a lease, cheap since a round is one query.
    reap-every: PT30S
    reap-first-after: PT30S
  first-operator:
    login-id: ${GLOSS_FIRST_OPERATOR_LOGIN_ID:}
    password: ${GLOSS_FIRST_OPERATOR_PASSWORD:}
    display-name: ${GLOSS_FIRST_OPERATOR_NAME:}
